name: Basic Security Checks

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC (reduced from daily)
    - cron: "0 2 * * 0"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_level:
        description: "Security scan level"
        required: false
        default: "basic"
        type: choice
        options:
          - basic
          - full

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-basic:
    name: Basic Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Test dependency audit gate
        run: node --test scripts/audit-backend.test.mjs

      - name: Audit backend production dependencies
        run: pnpm audit:backend

      - name: Audit remaining workspace dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated packages..."
          pnpm outdated || true

      - name: Check lockfile for vulnerabilities
        run: |
          echo "🔒 Checking lockfile security..."
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Lockfile exists and will be checked during install"
          else
            echo "No lockfile found"
          fi

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

